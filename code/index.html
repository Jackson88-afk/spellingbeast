    <div class="app-shell">
      <header class="hero">
        <a class="brand" href="/" aria-label="SpellingBeast home">
          <svg class="bee-mark" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M14 17c-5-1-7-5-5-8 4 0 7 3 8 7M26 17c5-1 7-5 5-8-4 0-7 3-8 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <ellipse cx="20" cy="22" rx="9" ry="11" fill="currentColor"/>
            <path d="M12 19h16M11.5 24h17" stroke="#fffdf9" stroke-width="2.8"/>
          </svg>
          <h1 class="brand-mark">SpellingBeast</h1>
        </a>
        <div class="header-actions">
          <button type="button" class="link-button" id="logout-button" hidden>Log Out</button>
          <button type="button" id="language-toggle">语言：中文</button>
        </div>
      </header>

      <main id="app" aria-live="polite"></main>
    </div>

</html>
