<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpellingBeast</title>
    <meta
      name="description"
      content="SpellingBeast v1 的最小前端脚手架，使用原生 HTML、CSS 和 JavaScript。"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./wordlist.js"></script>
    <script defer src="./import.js"></script>
    <script defer src="./persistence.js"></script>
    <script defer src="./mistake.js"></script>
    <script defer src="./answer.js"></script>
    <script defer src="./session.js"></script>
    <script defer src="./practice.js"></script>
    <script defer src="./audio.js"></script>
    <script defer src="./localization.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="hero card">
        <p class="eyebrow">SpellingBeast</p>
        <h1>拼写练习</h1>
        <p class="lead">添加自己的单词，然后开始练习。</p>
        <button type="button" id="language-toggle">语言：中文</button>
      </header>

      <main id="app" aria-live="polite"></main>

      <footer class="footer">
        <span>SpellingBeast</span>
        <span id="footer-tagline">Local-first static scaffold</span>
      </footer>
    </div>
  </body>
</html>
